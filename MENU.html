<meta charset="UTF-8">

<link rel="stylesheet" href="assets/css/ios-glow.css">

<style>
    @font-face {
        font-family: "Pricedown Bl";
        src: url("assets/fonts/Pricedown Bl.otf") format("truetype");
        font-weight: normal;
        font-style: normal;
    }

    * {
        font-family: "Pricedown Bl", sans-serif !important;
    }

.boton {
display:block;
border: 1px solid #2e518b;
padding: 10px; 
background-color:white;
color: black;
text-decoration: none;
text-transform: uppercase;
font-family: 'Helvetica', sans-serif;
font size: 25px;
border-radius: 50px;
}
.boton:hover{
    color: red;
    background-color: yellow;
  }

  :root {
      --bg-image: url("assets/img/bg.jpeg"); 
      --glow-gradiente: linear-gradient(
        90deg,
        #bc82f3,
        #f5b9ea,
        #8d99ff,
        #ff6778,
        #ffba71,
        #c686ff
      );
    }

    * {
      box-sizing: border-box;
      font-family: "Pricedown Bl", sans-serif !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #001122;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      overflow-x: hidden;
    }


    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 10, 24, 0.45);
      pointer-events: none;
      z-index: 0;
    }


    .caja-glow {
      position: relative;
      z-index: 1;
      max-width: 720px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      border-radius: 28px;
      background: rgba(12, 20, 38, 0.55);
      backdrop-filter: blur(20px) saturate(175%);
      -webkit-backdrop-filter: blur(20px) saturate(175%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

   
    .caja-glow::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      background: var(--glow-gradiente);
      background-size: 300% 300%;
      filter: blur(16px);
      opacity: 0.75;
      z-index: -1;
      animation: moverGlow 7s ease infinite;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(141, 153, 255, 0.85),
        0 0 28px rgba(188, 130, 243, 0.65);
    }

    h2 {
      margin: 0;
      font-size: clamp(1.2rem, 3.2vw, 1.8rem);
      line-height: 1.4;
      color: #7ef9ff;
      text-shadow:
        0 0 10px rgba(0, 255, 255, 0.7),
        0 0 24px rgba(141, 153, 255, 0.45);
    }

    @keyframes moverGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
</style>

</HEAD>
