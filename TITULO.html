
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título</title>

    <style>
        @font-face {
            font-family: "Pricedown Bl";
            src: url("assets/fonts/Pricedown Bl.otf") format("opentype");
        }

        * {
            font-family: "Pricedown Bl", sans-serif !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow-x: hidden;
        }

        .logo {
            display: block;
            width: 75%;
            max-width: 350px;
            height: auto;
            margin: 0 auto;
        }

        h1 {
            color: #FFFFFF;
            margin: -5px 0 0;
            padding: 0;
            text-align: center;
        }
    </style>
</head>

<body>

    <center>
        <img src="assets/img/title.png" class="logo" alt="Los Santos">
    </center>

    <center>
        <h1><marquee>Problemas del agua</marquee></h1>
    </center>

    <audio id="musica" preload="auto">
        <source src="assets/audio/sfx.mp3" type="audio/mpeg">
    </audio>

    <script>
        const musica = document.getElementById("musica");
        let primeraVez = true;

        musica.addEventListener("ended", async () => {
            musica.currentTime = 0;
            try {
                await musica.play();
            } catch (error) {
                console.log("El navegador bloqueó la reproducción.");
            }
        });

        window.addEventListener("load", async () => {
            try {
                await new Promise((resolve, reject) => {
                    if (musica.readyState >= 1) {
                        resolve();
                    } else {
                        musica.addEventListener("loadedmetadata", resolve, { once: true });
                        musica.addEventListener("error", reject, { once: true });
                    }
                });

                musica.currentTime = 60;
                await musica.play();

                primeraVez = false;
            } catch (error) {
                console.log("El navegador bloqueó el audio automático.");
            }
        });
    </script>

</body>
</html>
