<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>
  <link rel="icon" href="assets/img/icon.png" type="image/x-icon">


  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    #videoIntro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #iniciar {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: rgba(0, 0, 0, .45);
      color: white;
      font: 600 20px Arial, sans-serif;
      cursor: pointer;
    }
    #iniciar[hidden] { display: none; }

    @font-face {
        font-family: "Pricedown Bl";
        src: url("assets/fonts/Pricedown Bl.otf") format("truetype");
        font-weight: normal;
        font-style: normal;
    }

    * {
        font-family: "Pricedown Bl", sans-serif !important;
    }
  </style>
</head>
<body>
  <video id="videoIntro" autoplay playsinline preload="auto">
    <source src="assets/videos/loading_screen.mp4" type="video/mp4">
    Tu navegador no puede reproducir este video.
  </video>

  <button id="iniciar" hidden>▶ Tap Aca</button>

  <script>
    const video = document.getElementById('videoIntro');
    const boton = document.getElementById('iniciar');

    setTimeout(() => {
    document.title = "Grand Theft Auto V - Problemas del agua";
    }, 33000);
    
    video.addEventListener('ended', () => {
      window.location.href = 'principal.html';
    });


    video.muted = false;
    video.play().catch(() => {
      
      boton.hidden = false;
    });

    
    boton.addEventListener('click', async () => {
      boton.hidden = true;
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {
        
      }
      video.muted = false;
      video.play().catch(() => {
        boton.hidden = false;
      });
    });
  </script>
</body>
</html>
